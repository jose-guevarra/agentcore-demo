[project]
name = "chat-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jose Guevarra", email = "jagx4669@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aws-opentelemetry-distro>=0.19.0",
    "bedrock-agentcore>=1.18.1",
    "strands-agents>=1.51.0",
    "python-dotenv>=1.2.2",
    "strands-agents-tools>=0.8.6",
]

[project.scripts]
chat-agent = "chat_agent:main"

[build-system]
